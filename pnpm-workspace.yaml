packages:
  - apps/*
  - libs/*

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - node-pty

overrides:
  "electron-builder-squirrel-windows": "^26.15.3"
  "dmg-builder": "^26.15.3"
  "app-builder-lib": "^26.15.3"
  "builder-util-runtime": ">= 9.7.0"
  "@electron/rebuild": "4.0.3"
  "vite": ">= 8.0.16"
  # GHSA-g7r4-m6w7-qqqr: arbitrary file read from the dev server on Windows
  # (>= 0.27.3, < 0.28.1). The affected copy is the peer vite resolves; vite 8
  # accepts "^0.27.0 || ^0.28.0", so 0.28.x is in range. Kept global rather than
  # scoped to vite: esbuild is an *optional peer* there, and a scoped override
  # left vite with no esbuild at all instead of a patched one. The side effect is
  # that electron-vite 5.0.0 ("^0.25.11", not itself affected) is pulled up to the
  # same 0.28.x — it only uses the stable build/transform API.
  "esbuild": ">= 0.28.1"
  # GHSA-4x5r-pxfx-6jf8: arbitrary file read via sourceMappingURL comment
  # (<= 7.29.0). Caret, not ">=", because @vitejs/plugin-react 5.2.0 declares
  # "^7.29.0" and babel 8 would fall outside it.
  "@babel/core": "^7.29.6"
  "lodash": ">= 4.18.0"
  "@xmldom/xmldom": "^0.8.12"
  "brace-expansion": ">= 5.0.9"
  "picomatch": ">= 4.0.4"
  "yaml": ">= 2.8.3"
  "tar": ">= 7.5.19"
  "ajv": "^6.14.0"
  "@modelcontextprotocol/sdk>ajv": "^8.17.1"
  "rollup": ">= 4.59.0"
  "shell-quote": ">= 1.8.4"
  "ip-address": ">= 10.3.1"
  "tmp": ">= 0.2.6"
  "form-data": ">= 4.0.6"
  "postcss": ">= 8.5.18"
  "dompurify": ">= 3.4.6"
  "hono": ">= 4.12.27"
  "@hono/node-server": ">= 1.19.15"
  "@opentelemetry/core": ">= 2.8.0"
  "undici": "^7.29.0"
  "js-yaml": "^4.3.1"
  "fast-uri": "^3.1.5"
  "nanoid": "^3.3.18"
