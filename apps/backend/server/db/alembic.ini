# Alembic configuration for WorkPilot AI server mode.
# Run from apps/backend:  alembic -c server/db/alembic.ini upgrade head
# The database URL is taken from WORKPILOT_DATABASE_URL (see env.py),
# the value below is only a fallback for local development.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = ../..
sqlalchemy.url = sqlite+aiosqlite:///workpilot_server.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
