version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # npm dependencies.
  # Root, not /apps/frontend: this is a pnpm workspace, and pnpm-lock.yaml +
  # pnpm-workspace.yaml (which carries the security `overrides`) both live at the
  # top level. Pointed at apps/frontend, the updater saw a package.json with no
  # lockfile beside it and could not open a fix PR — both esbuild and @babel/core
  # were reported against `pnpm-lock.yaml` and neither got one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
